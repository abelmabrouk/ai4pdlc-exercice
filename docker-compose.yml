# Stack de développement de l'atelier : rien d'autre que Docker n'est requis sur le poste.
#   docker compose up -d                       -> API (http://localhost:5080) + front (http://localhost:4200)
#   docker compose run --rm backend-tests      -> tests xUnit du back
#   docker compose exec web npm run lint:styles -> stylelint du front
name: conges

services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src
    command: sh dev-watch.sh
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./backend:/src
      - nuget:/root/.nuget/packages
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    environment:
      API_URL: http://api:8080
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-4200}:4200"
    depends_on:
      api:
        condition: service_healthy

  backend-tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /src
    command: dotnet test --artifacts-path /artifacts
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./backend:/src
      - nuget:/root/.nuget/packages
      - test-artifacts:/artifacts

volumes:
  nuget:
  node_modules:
  test-artifacts:
